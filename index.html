<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Trail</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Rubik+Doodle+Shadow&display=swap" rel="stylesheet">
<style>
:root{--h:230;--bg:hsl(var(--h) 45% 96%);--ink:hsl(var(--h) 50% 18%);--panel:hsl(var(--h) 45% 88%);--dark:hsl(var(--h) 40% 50%);--muted:hsl(var(--h) 20% 42%);--pop:hsl(var(--h) 42% 44%);--tile:var(--dark);--pur:var(--pop);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:hsl(var(--h) 35% 12%);--ink:hsl(var(--h) 60% 95%);--panel:hsl(var(--h) 30% 19%);--dark:hsl(var(--h) 36% 46%);--muted:hsl(var(--h) 25% 70%);--pop:hsl(var(--h) 38% 46%)}}
:root[data-theme="dark"]{--bg:hsl(var(--h) 35% 12%);--ink:hsl(var(--h) 60% 95%);--panel:hsl(var(--h) 30% 19%);--dark:hsl(var(--h) 36% 46%);--muted:hsl(var(--h) 25% 70%);--pop:hsl(var(--h) 38% 46%)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;font-size:18px;display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
main{width:100%;max-width:480px;padding:24px 16px 40px;text-align:center}
h1{margin:0 0 8px;font-family:"Rubik Doodle Shadow","Outfit",system-ui,sans-serif;font-weight:400;font-size:clamp(30px,9.5vw,44px);letter-spacing:1px;line-height:1.1}
.sub{margin:0 0 16px;color:var(--muted);font-size:18px}
.theme{display:inline-block;background:var(--panel);border-radius:14px;padding:6px 18px;font-weight:700;font-size:20px;margin-bottom:12px}
.hints{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:6px}
.hint{background:var(--panel);border-radius:8px;padding:6px 10px;font-weight:700;font-size:16px;letter-spacing:2px;color:var(--ink)}
.hint.done{color:#fff}
#cur{min-height:28px;line-height:28px;font-size:24px;font-weight:800;letter-spacing:3px;margin-bottom:6px}
#grid{display:grid;gap:6px;margin:0 auto 16px;max-width:420px;touch-action:none;user-select:none;-webkit-user-select:none}
.cell{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;background:var(--tile);color:#fff;font-size:clamp(18px,6vw,26px);font-weight:700}
.cell.sel{background:var(--pop);outline:3px solid var(--ink);outline-offset:-3px}
.cell.gone{background:transparent;color:transparent;pointer-events:none}
.cell.reveal{pointer-events:none}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
button{font:inherit;font-weight:600;padding:6px 18px;border-radius:8px;border:2px solid var(--muted);background:transparent;color:var(--ink);cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#msg{min-height:26px;font-weight:600;margin:6px 0 14px}
#winners:empty{display:none}
#winners{margin:0 0 6px}
.win .wh{font-size:.75em;opacity:.85;margin-bottom:6px}
.win .wl{margin:3px 0}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
.win{background:var(--pop);color:#fff;border-radius:10px;padding:12px;font-size:22px;font-weight:800;max-width:420px;margin:0 auto;animation:pop .5s ease-out;word-break:break-word}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.win{animation:none}}
@media (min-width:800px){
body{font-size:26px}
main{max-width:820px;padding-top:32px}
h1{font-size:66px;margin-bottom:12px}
.sub{font-size:25px}
.theme{font-size:28px}
.hint{font-size:22px;padding:8px 14px}
#cur{font-size:34px;min-height:40px;line-height:40px}
.cell{font-size:34px}
#msg{min-height:40px}
.row button{padding:8px 26px}
.win{font-size:30px;max-width:620px}
}
</style>
</head>
<body>
<main>
  <h1>Word Trail</h1>
  <p class="sub">Connect neighbouring letters to find the 5 to 7 hidden words that match the theme.</p>
  <div class="theme" id="theme"></div>
  <div class="hints" id="hints" aria-label="Starting letter hints"></div>
  <div id="winners" aria-live="polite"></div>
  <div id="cur" aria-live="polite"></div>
  <div id="grid"></div>
    <div id="msg" role="status"></div>
  <div class="row"><button id="new">New game</button><button id="give">Give up</button></div>
</main>
<script>
const T={

"Jobs":"CHEF PILOT NURSE DOCTOR FARMER TEACHER BAKER JUDGE ARTIST DRIVER WRITER SAILOR ENGINEER DENTIST PLUMBER CARPENTER SCIENTIST ACCOUNTANT POLICE ACTOR PAINTER MECHANIC LAWYER CASHIER BARBER GARDENER SOLDIER",
"Flowers":"ROSE TULIP DAISY LILY ORCHID LOTUS PEONY POPPY JASMINE VIOLET SUNFLOWER LAVENDER DAFFODIL MARIGOLD CARNATION HIBISCUS BLUEBELL LILAC CLOVER MAGNOLIA BEGONIA",
"Space":"MOON STAR MARS EARTH COMET ORBIT PLANET GALAXY ROCKET VENUS SATURN ECLIPSE JUPITER NEPTUNE URANUS MERCURY ASTEROID TELESCOPE ASTRONAUT SATELLITE UNIVERSE METEOR NEBULA SUPERNOVA GRAVITY",
"School":"DESK BOOK PENCIL ERASER RULER CHALK MARKER SCHOOL LESSON TEST HOMEWORK TEACHER STUDENT NOTEBOOK BACKPACK SCISSORS CALENDAR LIBRARY CLASSROOM PLAYGROUND SHARPENER STAPLER EXAM",
"Countries":"CHINA INDIA JAPAN SPAIN ITALY EGYPT KENYA PERU CUBA IRAN BRAZIL FRANCE CANADA GERMANY MEXICO RUSSIA TURKEY NEPAL CHILE GHANA ARGENTINA AUSTRALIA THAILAND VIETNAM INDONESIA SINGAPORE MALAYSIA NORWAY SWEDEN FINLAND ICELAND PORTUGAL IRELAND ENGLAND COLOMBIA",
"Vegetables":"CARROT ONION POTATO TOMATO BEAN CORN KALE LEEK BEET CELERY SPINACH CABBAGE RADISH TURNIP GARLIC CUCUMBER BROCCOLI PUMPKIN LETTUCE EGGPLANT ASPARAGUS MUSHROOM ZUCCHINI CAPSICUM PEPPER",
"Drinks":"COFFEE JUICE MILK WATER SODA COLA WINE BEER COCOA LATTE MOCHA CIDER PUNCH SHAKE LEMONADE SMOOTHIE CAPPUCCINO ESPRESSO CHAMPAGNE MILKSHAKE KOMBUCHA COCKTAIL WHISKEY ORANGEADE",
"Furniture":"SOFA CHAIR TABLE DESK SHELF STOOL BENCH LAMP DRAWER CABINET COUCH MIRROR CLOSET WARDROBE BOOKCASE ARMCHAIR BEDSIDE HAMMOCK CUPBOARD DRESSER OTTOMAN FUTON NIGHTSTAND RECLINER CHANDELIER",
"Clothing":"SHIRT PANTS DRESS SKIRT SOCKS SHOES BOOTS COAT SCARF JACKET GLOVES SWEATER JEANS SHORTS TROUSERS UNDERWEAR SWIMSUIT PYJAMAS CARDIGAN RAINCOAT SNEAKERS SANDALS BLOUSE HOODIE LEGGINGS JUMPSUIT",
"Instruments":"PIANO GUITAR DRUM FLUTE VIOLIN HARP TRUMPET CELLO BANJO TUBA OBOE BUGLE ORGAN SITAR LUTE CLARINET SAXOPHONE TROMBONE ACCORDION UKULELE HARMONICA TAMBOURINE XYLOPHONE BAGPIPES MARIMBA KEYBOARD TRIANGLE MANDOLIN",

"Sea life":"SHARK WHALE CRAB SQUID OCTOPUS DOLPHIN SEAL TUNA CORAL OYSTER LOBSTER SHRIMP TURTLE OTTER CLAM JELLYFISH STARFISH SEAHORSE STINGRAY SWORDFISH BARRACUDA PLANKTON ANEMONE SALMON WALRUS MANATEE",

"Metals and gems":"GOLD SILVER IRON COPPER ZINC LEAD STEEL BRONZE RUBY PEARL JADE OPAL AMBER DIAMOND TOPAZ EMERALD SAPPHIRE TURQUOISE ALUMINIUM TITANIUM PLATINUM GRAPHITE CRYSTAL GARNET AMETHYST MERCURY",
"Family":"MOTHER FATHER SISTER BROTHER UNCLE AUNT COUSIN NIECE NEPHEW BABY GRANDMA GRANDPA DAUGHTER PARENTS CHILDREN HUSBAND FAMILY TODDLER TWINS GRANDSON RELATIVES SIBLING STEPFATHER ANCESTOR",
"Feelings":"HAPPY ANGRY CALM PROUD BRAVE LONELY JOYFUL EXCITED NERVOUS TIRED BORED SCARED HOPEFUL EAGER GRATEFUL CHEERFUL ANXIOUS CURIOUS CONFUSED DELIGHTED FRUSTRATED SURPRISED RELAXED JEALOUS OPTIMISTIC",
"Calendar":"JUNE JULY MARCH APRIL AUGUST JANUARY OCTOBER MONDAY FRIDAY SUNDAY TUESDAY WEEKEND SEPTEMBER NOVEMBER DECEMBER FEBRUARY THURSDAY SATURDAY WEDNESDAY YESTERDAY TOMORROW MIDNIGHT MORNING EVENING",
"Desserts":"CAKE COOKIE BROWNIE DONUT PUDDING CANDY FUDGE TART SUNDAE MUFFIN GELATO WAFFLE CUPCAKE JELLY PASTRY CHEESECAKE CUSTARD CARAMEL NOUGAT MERINGUE TIRAMISU MILKSHAKE LOLLIPOP CHOCOLATE STRUDEL",
"Spices and herbs":"CUMIN GINGER CLOVE PEPPER SALT CHILI BASIL MINT SAGE DILL THYME CURRY SAFFRON PAPRIKA FENNEL CINNAMON OREGANO PARSLEY NUTMEG TURMERIC CORIANDER ROSEMARY CARDAMOM LEMONGRASS TARRAGON VANILLA MUSTARD",
"Shapes":"CIRCLE SQUARE OVAL HEART DIAMOND CUBE CONE SPHERE LINE ARROW CROSS PRISM TRIANGLE RECTANGLE PENTAGON HEXAGON OCTAGON CYLINDER PYRAMID CRESCENT ELLIPSE POLYGON RHOMBUS TRAPEZOID SPIRAL STAR",
"Garden":"GRASS SEED SOIL ROSE TREE HOSE SHOVEL RAKE PLANT FENCE BENCH POND WEEDS LEAF BRANCH FLOWERS FOUNTAIN GREENHOUSE SPRINKLER SCARECROW COMPOST HEDGE LAWNMOWER FLOWERBED TRELLIS GARDENER",
"Gadgets":"MOUSE SCREEN LAPTOP TABLET CABLE CHARGER PRINTER MONITOR SPEAKER PHONE CAMERA ROUTER MODEM CHIP DISK KEYBOARD HEADPHONES SMARTPHONE MICROPHONE CONTROLLER PROJECTOR SMARTWATCH BATTERY TELEVISION BLUETOOTH FLASHDRIVE WEBCAM",
"Malaysian cuisine":"LAKSA SATAY ROTI NASI LEMAK RENDANG SAMBAL CENDOL MURTABAK TEMPEH KUIH POPIA OTAK PANDAN ULAM TEHTARIK MAMAK CURRY CANAI ROJAK KANGKONG KARIPAP PULUT APAM SOTONG KERABU DURIAN SERUNDING NASILEMAK ROTICANAI",
"World cuisine":"SUSHI PIZZA PASTA TACO CURRY RAMEN KEBAB PAELLA BURRITO DUMPLING LASAGNA FALAFEL SHAWARMA RISOTTO TEMPURA NACHOS CROISSANT PRETZEL SCHNITZEL GOULASH BIRYANI HUMMUS KIMCHI TZATZIKI FONDUE GNOCCHI POUTINE TERIYAKI BAKLAVA EMPANADA PIEROGI SASHIMI"};
const THEMES={};for(const k in T)THEMES[k]=T[k].split(" ");
const DIMS={}; // total letters -> [cols,rows], squarest grid with at most 7 columns and 7 rows
for(let c=4;c<=7;c++)for(let r=c;r<=7;r++){const t=c*r;if(t<20)continue;if(!DIMS[t]||r-c<DIMS[t][1]-DIMS[t][0])DIMS[t]=[c,r]}
const $=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const HUES=[0,15,155,180,205,230,260,285,320];
let hue=-1,theme="",words=[],C=0,R=0,letters=[],placed={},found=new Set(),colors={},path=[],dragging=false,moved=false,over=false,round=0,finders={};

function pickSet(pool){
  pool=pool.filter(w=>w.length>=4&&w.length<=10);
  for(let t=0;t<1500;t++){
    const k=Math.min(pool.length,5+Math.floor(Math.random()*3));
    const ws=shuffle(pool).slice(0,k);
    const sum=ws.reduce((a,w)=>a+w.length,0);
    if(!DIMS[sum])continue;
    if(ws.some(x=>ws.some(y=>x!==y&&y.includes(x))))continue;
    return ws;
  }
  return null;
}
function neighbours(i){
  const r=Math.floor(i/C),c=i%C,out=[];
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    if(!dr&&!dc)continue;
    const rr=r+dr,cc=c+dc;
    if(rr>=0&&rr<R&&cc>=0&&cc<C)out.push(rr*C+cc);
  }
  return out;
}
function layout(ws){
  // fill the whole grid with the words as connected paths
  const used=Array(R*C).fill(false),cellOf={};let budget=120000;
  const order=shuffle(ws).sort((a,b)=>b.length-a.length);
  function emptyCount(i){return neighbours(i).filter(j=>!used[j]).length}
  function place(idx){
    if(idx===order.length)return true;
    const w=order[idx];
    const empties=[];for(let i=0;i<R*C;i++)if(!used[i])empties.push(i);
    const mn=Math.min(...empties.map(emptyCount));
    const starts=shuffle(empties.filter(i=>emptyCount(i)===mn));
    const s=starts[0];
    const rev=Math.random()<.5,str=rev?[...w].reverse().join(""):w;
    const cells=[];
    function dfs(cell,pos){
      if(--budget<0)return false;
      used[cell]=true;cells.push(cell);
      if(pos===str.length-1){
        cellOf[w]=rev?[...cells].reverse():[...cells];
        if(place(idx+1))return true;
        delete cellOf[w];
      }else{
        for(const nx of shuffle(neighbours(cell)))if(!used[nx]&&dfs(nx,pos+1))return true;
      }
      used[cell]=false;cells.pop();return false;
    }
    return dfs(s,0);
  }
  if(!place(0))return null;
  return cellOf;
}
function build(){
  for(let attempt=0;attempt<200;attempt++){
    const names=shuffle(Object.keys(THEMES)).filter(n=>n!==theme);
    const name=names[0];
    const ws=pickSet(THEMES[name]);
    if(!ws)continue;
    const total=ws.reduce((a,w)=>a+w.length,0);
    [C,R]=DIMS[total];
    const cellOf=layout(ws);
    if(!cellOf)continue;
    theme=name;words=ws;placed=cellOf;
    letters=Array(R*C).fill("");
    for(const w of ws)placed[w].forEach((ci,k)=>letters[ci]=w[k]);
    return true;
  }
  return false;
}
function draw(){
  $("theme").textContent="Theme: "+theme;
  const hs=[...words].sort((a,b)=>a.length-b.length||a.localeCompare(b));
  $("hints").innerHTML=hs.map(w=>found.has(w)?`<span class="hint done" style="background:${colors[w]}">${w}</span>`:`<span class="hint">${w[0]} ${"_ ".repeat(w.length-1).trim()}</span>`).join("");
  const cellColor={};
  for(const w of words)if(found.has(w))placed[w].forEach(ci=>cellColor[ci]=colors[w]);
  $("grid").style.gridTemplateColumns=`repeat(${C},1fr)`;
  const big=innerWidth>=800;$("grid").style.maxWidth=Math.min(big?620:420,C*(big?92:74))+"px";
  $("grid").innerHTML=letters.map((ch,i)=>{
    const g=cellColor[i];
    const cls="cell"+(path.includes(i)?" sel":"")+(g&&!over?" gone":"")+(g&&over?" reveal":"");
    const st=g&&over?` style="background:${g}"`:"";
    return `<div class="${cls}" data-i="${i}"${st}>${ch}</div>`;
  }).join("");
  $("cur").textContent=path.map(i=>letters[i]).join("");
}
function newPuzzle(){
  if(!build()){$("msg").textContent="Could not build a puzzle. Try again.";return}
  round++;found=new Set();finders={};$("winners").innerHTML="";path=[];over=false;$("give").disabled=false;
  let h;do{h=HUES[Math.floor(Math.random()*HUES.length)]}while(h===hue);
  hue=h;document.documentElement.style.setProperty("--h",h);
  colors={};words.forEach((w,i)=>colors[w]=`hsl(${(h+Math.round(i*360/words.length))%360} 55% 40%)`);
  $("msg").textContent="";draw();
}
function adj(a,b){return a!==b&&Math.abs(Math.floor(a/C)-Math.floor(b/C))<=1&&Math.abs(a%C-b%C)<=1}
function cellAt(e){
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const c=el&&el.closest?el.closest(".cell"):null;
  return c&&!c.classList.contains("gone")?+c.dataset.i:null;
}
function autoCheck(){
  if(over||!path.length)return;
  const text=path.map(i=>letters[i]).join("");
  if(words.includes(text)&&!found.has(text)){dragging=false;submit()}
}
function submit(){
  if(over||!path.length)return;
  const text=path.map(i=>letters[i]).join("");
  if(words.includes(text)&&!found.has(text)){
    found.add(text);finders[text]=nameOf();$("msg").textContent=`Found ${text}!`;
    if(found.size===words.length){
      over=true;$("give").disabled=true;path=[];draw();popup();confetti();return;
    }
  }else if(found.has(text))$("msg").textContent="You already found that word.";
  else $("msg").textContent="Not one of the hidden words.";
  path=[];draw();
}
$("grid").addEventListener("pointerdown",e=>{
  if(over)return;
  const i=cellAt(e);if(i===null)return;
  e.preventDefault();dragging=true;moved=false;
  if(path.length&&!path.includes(i)&&adj(path[path.length-1],i))path.push(i);
  else if(path.length&&path[path.length-1]===i)path.pop();
  else path=[i];
  draw();autoCheck();
});
$("grid").addEventListener("pointermove",e=>{
  if(!dragging)return;
  const i=cellAt(e);if(i===null)return;
  const last=path[path.length-1];
  if(path.length>1&&i===path[path.length-2]){path.pop();moved=true;draw()}
  else if(!path.includes(i)&&adj(last,i)){path.push(i);moved=true;draw();autoCheck()}
});
function endDrag(){if(!dragging)return;dragging=false;if(moved&&path.length>1)submit()}
window.addEventListener("pointerup",endDrag);
window.addEventListener("pointercancel",()=>{dragging=false});
$("new").onclick=newPuzzle;
$("give").onclick=()=>{
  if(over)return;
  over=true;$("give").disabled=true;path=[];words.forEach(w=>found.add(w));
  $("msg").textContent="You gave up. Here are all the words.";draw();
  const r=round;setTimeout(()=>{if(over&&round===r)newPuzzle()},8000);
};
function nameOf(who){let nm=who||"";try{nm=nm||(new URLSearchParams(location.search).get("name")||window.playerName||"").trim().slice(0,30)}catch(e){}return nm||"Player"}
function popup(){
  const by={};
  Object.keys(finders).forEach(w=>(by[finders[w]]=by[finders[w]]||[]).push(w));
  const names=Object.keys(by).sort((x,y)=>by[y].length-by[x].length);
  const d=document.createElement("div");d.className="win";
  const h=document.createElement("div");h.className="wh";h.textContent=names.length>1?"Winners":"Winner";d.appendChild(h);
  names.forEach(n=>{const l=document.createElement("div");l.className="wl";l.textContent=`${n} found ${by[n].join(", ")}`;d.appendChild(l)});
  const w=$("winners");w.innerHTML="";w.appendChild(d);
  $("msg").textContent="";
  const r=round;setTimeout(()=>{if(over&&round===r)newPuzzle()},8000);
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.createElement("canvas");c.id="confetti";c.width=innerWidth;c.height=innerHeight;document.body.append(c);
  const x=c.getContext("2d"),cols=[0,45,150,200,260,320].map(h=>`hsl(${h} 85% 55%)`);
  const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*13-4,s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;
  (function f(){
    x.clearRect(0,0,c.width,c.height);t++;
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(t<160)requestAnimationFrame(f);else c.remove();
  })();
}
function guess(word,name){
  if(over)return"over";
  const w=String(word||"").trim().toUpperCase().replace(/[^A-Z]/g,"");
  if(!w||!words.includes(w))return"wrong";
  if(found.has(w))return"dup";
  found.add(w);finders[w]=nameOf(String(name||"").trim().slice(0,30));
  $("msg").textContent=`${finders[w]} found ${w}!`;
  if(found.size===words.length){over=true;$("give").disabled=true;path=[];draw();popup();confetti();return"ok"}
  draw();return"ok";
}
window.submitGuess=guess;
window.addEventListener("message",e=>{const d=e.data;if(d&&d.type==="guess")guess(d.word,d.name)});
const LIVE=/[?&]live=1/.test(location.search)||location.protocol==="file:";
function tikfinity(){let ws;try{ws=new WebSocket("ws://127.0.0.1:21213/")}catch(e){return}
ws.onmessage=ev=>{try{const m=JSON.parse(ev.data),d=m.data||m;if(!/chat|comment/i.test(String(m.event||m.type||"")))return;const u=d.user||{};guess(d.comment||d.text||d.message,d.nickname||d.uniqueId||u.nickname||u.uniqueId)}catch(e){}};
ws.onclose=()=>setTimeout(tikfinity,3000);ws.onerror=()=>ws.close()}
if(LIVE)tikfinity();
newPuzzle();
</script>
